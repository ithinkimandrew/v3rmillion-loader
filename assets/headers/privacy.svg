<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="img" aria-label="Privacy">
  <defs>
    <radialGradient id="hg" cx="6%" cy="50%" r="36%">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".32"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e02424"/>
      <stop offset="1" stop-color="#8f1010"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22c55e" stop-opacity=".95"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".028"/>
    </pattern>
    <clipPath id="hclip"><rect width="1200" height="72" rx="14"/></clipPath>
  </defs>
  <style>
    @keyframes sweep{0%{transform:translateX(-340px)}100%{transform:translateX(1260px)}}
    @keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.28}}
    @keyframes barBreath{0%,100%{opacity:.85}50%{opacity:1}}
    .beam{animation:sweep 6.5s cubic-bezier(.4,0,.2,1) infinite}
    .dp{animation:dotPulse 2s ease-in-out infinite}
    .ab{animation:barBreath 3s ease-in-out infinite}
    @keyframes chk{0%,20%{stroke-dashoffset:18}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:18}}
      .chk{stroke-dasharray:18;animation:chk 3.6s ease-in-out infinite}
  </style>
  <g clip-path="url(#hclip)">
    <rect width="1200" height="72" fill="#0f0f11"/>
    <rect width="1200" height="72" fill="url(#hgrid)"/>
    <rect width="1200" height="72" fill="url(#hg)"/>
    <rect x="0" y="70" width="1200" height="2" fill="#ffffff" fill-opacity=".05"/>
    <rect class="beam" x="0" y="69.5" width="320" height="2.5" rx="1.25" fill="url(#beam)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="71" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".09"/>

  <rect class="ab" x="14" y="16" width="4" height="40" rx="2" fill="url(#accentBar)"/>

  <rect x="30" y="14" width="44" height="44" rx="11" fill="#17171a" stroke="#22c55e" stroke-opacity=".35"/>
  <g transform="translate(52 36)">
    <path d="M0 -11.5L9.5 -7.5v6.2c0 5.4-3.8 10-9.5 11.8-5.7-1.8-9.5-6.4-9.5-11.8v-6.2z" fill="#22c55e" fill-opacity=".14" stroke="#22c55e" stroke-width="1.7" stroke-linejoin="round"/>
      <path class="chk" d="M-4.2 .2l2.9 3 5.8-6" fill="none" stroke="#f2f2f3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="90" y="45" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="-0.4" fill="#f2f2f3">Privacy</text>

  <g transform="translate(956 20)">
    <rect width="224" height="32" rx="16" fill="#17171a" stroke="#ffffff" stroke-opacity=".08"/>
    <circle class="dp" cx="20" cy="16" r="4" fill="#22c55e"/>
    <text x="34" y="20.5" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.1" fill="#a1a1aa">09 // SECURITY</text>
  </g>
</svg>
