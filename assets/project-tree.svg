<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-label="Manifest V3 codebase architecture map showing manifest.json, content.js and content.css, background.js service worker, popup UI files, and animated message-passing and storage buses">
  <defs>
    <radialGradient id="ptGlowL" cx="10%" cy="10%" r="50%">
      <stop offset="0" stop-color="#8f1010" stop-opacity=".32"/>
      <stop offset="1" stop-color="#8f1010" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ptGlowR" cx="92%" cy="85%" r="48%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".14"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ptGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".028"/>
    </pattern>
    <clipPath id="ptFrame"><rect width="1200" height="310" rx="18"/></clipPath>
  </defs>
  <style>
    .t-head{font-family:'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace;font-size:11px;font-weight:700;letter-spacing:.9px}
    .t-title{font-family:'Segoe UI', Inter, Helvetica, Arial, sans-serif;font-size:14.5px;font-weight:700;fill:#f2f2f3}
    .t-sub{font-family:'Segoe UI', Inter, Helvetica, Arial, sans-serif;font-size:11px;fill:#a1a1aa}
    .t-file{font-family:'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace;font-size:11px;font-weight:600;fill:#f2f2f3}
    .t-note{font-family:'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace;font-size:9.5px;fill:#6b6b74}
    .t-bus{font-family:'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace;font-size:9.5px;font-weight:700}

    @keyframes flowR{from{stroke-dashoffset:48}to{stroke-dashoffset:0}}
    @keyframes flowL{from{stroke-dashoffset:0}to{stroke-dashoffset:48}}
    @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.28}}
    .bus-r{stroke-dasharray:8 12;animation:flowR 1.4s linear infinite}
    .bus-l{stroke-dasharray:8 12;animation:flowL 1.4s linear infinite}
    .bus-v{stroke-dasharray:6 10;animation:flowR 1.6s linear infinite}
    .pdot{animation:pulseDot 1.9s ease-in-out infinite}
  </style>

  <g clip-path="url(#ptFrame)">
    <rect width="1200" height="310" fill="#0f0f11"/>
    <rect width="1200" height="310" fill="url(#ptGrid)"/>
    <rect width="1200" height="310" fill="url(#ptGlowL)"/>
    <rect width="1200" height="310" fill="url(#ptGlowR)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="309" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".085"/>

  <!-- Header -->
  <circle class="pdot" cx="38" cy="30" r="4" fill="#e02424"/>
  <text x="51" y="34" class="t-head" fill="#f2f2f3">MANIFEST V3 ARCHITECTURE</text>
  <text x="242" y="34" class="t-head" fill="#6b6b74">// RUNTIME MODULES &amp; MESSAGE BUS</text>
  <rect x="976" y="17" width="196" height="24" rx="12" fill="#17171a" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="1074" y="32.5" text-anchor="middle" class="t-bus" fill="#a1a1aa">8 RUNTIME FILES // 0 DEPS</text>

  <!-- ================= CONNECTORS & MESSAGE BUSES ================= -->
  <!-- Manifest -> Content (registers) -->
  <line x1="234" y1="144" x2="272" y2="144" stroke="#ffffff" stroke-opacity=".14" stroke-width="1.8" stroke-dasharray="4 4"/>
  <path d="M266 140l5 4-5 4" fill="none" stroke="#a1a1aa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Content <-> Service Worker message bus -->
  <line x1="516" y1="130" x2="588" y2="130" stroke="#e02424" stroke-opacity=".2" stroke-width="2"/>
  <line x1="516" y1="130" x2="588" y2="130" stroke="#e02424" stroke-width="2.2" stroke-linecap="round" class="bus-r"/>
  <path d="M582 125l5 5-5 5" fill="none" stroke="#e02424" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="524" y="106" width="56" height="17" rx="5" fill="#17171a" stroke="#e02424" stroke-opacity=".35"/>
  <text x="552" y="117.5" text-anchor="middle" class="t-bus" fill="#e02424">report</text>

  <line x1="588" y1="162" x2="516" y2="162" stroke="#38bdf8" stroke-opacity=".2" stroke-width="1.8"/>
  <line x1="588" y1="162" x2="516" y2="162" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" class="bus-l"/>
  <path d="M522 157l-5 5 5 5" fill="none" stroke="#38bdf8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="522" y="169" width="60" height="17" rx="5" fill="#17171a" stroke="#38bdf8" stroke-opacity=".32"/>
  <text x="552" y="180.5" text-anchor="middle" class="t-bus" fill="#38bdf8">onChange</text>

  <!-- Service Worker <-> Popup message bus -->
  <line x1="832" y1="130" x2="912" y2="130" stroke="#22c55e" stroke-opacity=".2" stroke-width="2"/>
  <line x1="832" y1="130" x2="912" y2="130" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" class="bus-r"/>
  <path d="M906 125l5 5-5 5" fill="none" stroke="#22c55e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="841" y="106" width="62" height="17" rx="5" fill="#17171a" stroke="#22c55e" stroke-opacity=".35"/>
  <text x="872" y="117.5" text-anchor="middle" class="t-bus" fill="#22c55e">stats</text>

  <line x1="912" y1="162" x2="832" y2="162" stroke="#38bdf8" stroke-opacity=".2" stroke-width="2"/>
  <line x1="912" y1="162" x2="832" y2="162" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" class="bus-l"/>
  <path d="M838 157l-5 5 5 5" fill="none" stroke="#38bdf8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="838" y="169" width="68" height="17" rx="5" fill="#17171a" stroke="#38bdf8" stroke-opacity=".32"/>
  <text x="872" y="180.5" text-anchor="middle" class="t-bus" fill="#38bdf8">getStats</text>

  <!-- Vertical drops into Chrome Storage Bus -->
  <line x1="394" y1="234" x2="394" y2="254" stroke="#38bdf8" stroke-width="2" class="bus-v"/>
  <line x1="710" y1="234" x2="710" y2="254" stroke="#e02424" stroke-width="2" class="bus-v"/>
  <line x1="1042" y1="234" x2="1042" y2="254" stroke="#22c55e" stroke-width="2" class="bus-v"/>

  <!-- ================= CARD 1: Manifest ================= -->
  <g transform="translate(28 54)">
    <rect width="206" height="180" rx="13" fill="#17171a" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="0" y="14" width="3" height="34" rx="1.5" fill="#f59e0b"/>
    <text x="14" y="28" class="t-title">Extension Manifest</text>
    <text x="14" y="44" class="t-sub">Permissions &amp; wiring</text>
    <rect x="14" y="56" width="178" height="32" rx="8" fill="#121215" stroke="#f59e0b" stroke-opacity=".3"/>
    <circle cx="26" cy="72" r="3.5" fill="#f59e0b"/>
    <text x="36" y="76" class="t-file">manifest.json</text>
    <text x="14" y="108" class="t-note">manifest_version: 3</text>
    <text x="14" y="125" class="t-note">perm: storage</text>
    <text x="14" y="142" class="t-note">host: v3rmillion.net</text>
    <text x="14" y="159" class="t-note">host: *.v3rm.net</text>
  </g>

  <!-- ================= CARD 2: Content Layer ================= -->
  <g transform="translate(272 54)">
    <rect width="244" height="180" rx="13" fill="#17171a" stroke="#e02424" stroke-opacity=".35"/>
    <rect x="0" y="14" width="3" height="34" rx="1.5" fill="#e02424"/>
    <text x="14" y="28" class="t-title">Content Layer</text>
    <text x="14" y="44" class="t-sub">Injected at document_start</text>

    <rect x="14" y="56" width="216" height="52" rx="8" fill="#121215" stroke="#e02424" stroke-opacity=".3"/>
    <circle cx="26" cy="72" r="3.5" fill="#e02424"/>
    <text x="36" y="76" class="t-file">content.js</text>
    <text x="24" y="95" class="t-note">CSS, image prober, scanner, JS guard</text>

    <rect x="14" y="116" width="216" height="50" rx="8" fill="#121215" stroke="#ffffff" stroke-opacity=".07"/>
    <circle cx="26" cy="132" r="3.5" fill="#a1a1aa"/>
    <text x="36" y="136" class="t-file">content.css</text>
    <text x="24" y="154" class="t-note">Fallback placeholder &amp; alert banner</text>
  </g>

  <!-- ================= CARD 3: Service Worker ================= -->
  <g transform="translate(588 54)">
    <rect width="244" height="180" rx="13" fill="#17171a" stroke="#38bdf8" stroke-opacity=".32"/>
    <rect x="0" y="14" width="3" height="34" rx="1.5" fill="#38bdf8"/>
    <text x="14" y="28" class="t-title">Service Worker</text>
    <text x="14" y="44" class="t-sub">Background state &amp; badge</text>

    <rect x="14" y="56" width="216" height="52" rx="8" fill="#121215" stroke="#38bdf8" stroke-opacity=".3"/>
    <circle cx="26" cy="72" r="3.5" fill="#38bdf8"/>
    <text x="36" y="76" class="t-file">background.js</text>
    <text x="24" y="95" class="t-note">Serialized promise queue &amp; router</text>

    <rect x="14" y="116" width="216" height="50" rx="8" fill="#121215" stroke="#ffffff" stroke-opacity=".07"/>
    <text x="24" y="135" class="t-note" fill="#a1a1aa">chrome.action badge (+N / !)</text>
    <text x="24" y="153" class="t-note">Per-tab cleanup on tabs.onRemoved</text>
  </g>

  <!-- ================= CARD 4: Popup UI ================= -->
  <g transform="translate(912 54)">
    <rect width="260" height="180" rx="13" fill="#17171a" stroke="#22c55e" stroke-opacity=".32"/>
    <rect x="0" y="14" width="3" height="34" rx="1.5" fill="#22c55e"/>
    <text x="14" y="28" class="t-title">Popup UI</text>
    <text x="14" y="44" class="t-sub">Dashboard, settings &amp; themes</text>

    <rect x="14" y="56" width="112" height="48" rx="8" fill="#121215" stroke="#ffffff" stroke-opacity=".07"/>
    <circle cx="24" cy="71" r="3" fill="#e02424"/>
    <text x="33" y="75" class="t-file">popup.html</text>
    <text x="24" y="93" class="t-note">2-tab layout</text>

    <rect x="134" y="56" width="112" height="48" rx="8" fill="#121215" stroke="#ffffff" stroke-opacity=".07"/>
    <circle cx="144" cy="71" r="3" fill="#38bdf8"/>
    <text x="153" y="75" class="t-file">popup.css</text>
    <text x="144" y="93" class="t-note">Dark + Light</text>

    <rect x="14" y="112" width="112" height="54" rx="8" fill="#121215" stroke="#22c55e" stroke-opacity=".28"/>
    <circle cx="24" cy="128" r="3" fill="#22c55e"/>
    <text x="33" y="132" class="t-file">popup.js</text>
    <text x="24" y="149" class="t-note">Stats &amp; prefs</text>

    <rect x="134" y="112" width="112" height="54" rx="8" fill="#121215" stroke="#f59e0b" stroke-opacity=".28"/>
    <circle cx="144" cy="128" r="3" fill="#f59e0b"/>
    <text x="153" y="132" class="t-file">theme.js</text>
    <text x="144" y="149" class="t-note">Pre-paint init</text>
  </g>

  <!-- ================= BOTTOM BAR: assets/ note + Chrome Storage Bus ================= -->
  <g transform="translate(28 254)">
    <rect width="206" height="38" rx="10" fill="#17171a" stroke="#ffffff" stroke-opacity=".07"/>
    <text x="14" y="23" class="t-file" font-size="10.5">assets/</text>
    <text x="194" y="23" text-anchor="end" class="t-note">docs only (unloaded)</text>
  </g>

  <g transform="translate(272 254)">
    <rect width="900" height="38" rx="10" fill="#17171a" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="16" y="23" class="t-head" fill="#a1a1aa">CHROME STORAGE BUS</text>
    <rect x="190" y="8" width="218" height="22" rx="6" fill="#121215" stroke="#38bdf8" stroke-opacity=".3"/>
    <text x="299" y="22.5" text-anchor="middle" class="t-bus" fill="#38bdf8">storage.sync :: settings</text>
    <rect x="424" y="8" width="222" height="22" rx="6" fill="#121215" stroke="#e02424" stroke-opacity=".3"/>
    <text x="535" y="22.5" text-anchor="middle" class="t-bus" fill="#e02424">storage.session :: tab:id</text>
    <rect x="662" y="8" width="222" height="22" rx="6" fill="#121215" stroke="#22c55e" stroke-opacity=".3"/>
    <text x="773" y="22.5" text-anchor="middle" class="t-bus" fill="#22c55e">storage.local :: lifetime</text>
  </g>
</svg>
