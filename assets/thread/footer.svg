<svg xmlns="http://www.w3.org/2000/svg" width="960" height="76" viewBox="0 0 960 76" role="img" aria-label="V3rmillion Loader - Built for the V3rmillion community. Feedback and bug reports welcome below.">
  <defs>
    <radialGradient id="ftGlow" cx="50%" cy="120%" r="62%">
      <stop offset="0" stop-color="#8f1010" stop-opacity=".42"/>
      <stop offset="1" stop-color="#8f1010" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ftLogo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e02424"/>
      <stop offset="1" stop-color="#8f1010"/>
    </linearGradient>
    <pattern id="ftGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".028"/>
    </pattern>
    <clipPath id="ftClip"><rect width="960" height="76" rx="14"/></clipPath>
  </defs>
  <style>
    @keyframes waveFlow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-192}}
    @keyframes ledBlink{0%,100%{opacity:1}50%{opacity:.28}}
    .wv{stroke-dasharray:12 8;animation:waveFlow 8s linear infinite}
    .ld{animation:ledBlink 1.8s ease-in-out infinite}
  </style>

  <g clip-path="url(#ftClip)">
    <rect width="960" height="76" fill="#0f0f11"/>
    <rect width="960" height="76" fill="url(#ftGrid)"/>
    <rect width="960" height="76" fill="url(#ftGlow)"/>
    <path class="wv" d="M0 58 Q 120 42, 240 58 T 480 58 T 720 58 T 960 58" fill="none" stroke="#c21b1b" stroke-opacity=".26" stroke-width="1.5"/>
  </g>
  <rect x=".5" y=".5" width="959" height="75" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <rect x="20" y="18" width="40" height="40" rx="10" fill="url(#ftLogo)"/>
  <rect x="20" y="18" width="40" height="20" rx="10" fill="#ffffff" fill-opacity=".1"/>
  <text x="40" y="45" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">V3</text>

  <text x="74" y="35" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#f2f2f3">V3rmillion Loader <tspan font-weight="400" fill="#a1a1aa"> ·  Built for the V3rmillion community</tspan></text>
  <text x="74" y="55" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b6b74">Feedback and bug reports welcome below.</text>

  <g transform="translate(752 23)">
    <rect width="188" height="30" rx="15" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".35"/>
    <circle class="ld" cx="20" cy="15" r="4" fill="#22c55e"/>
    <text x="34" y="19" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="11" font-weight="700" fill="#22c55e">v1.4.0 · OPEN SOURCE</text>
  </g>
</svg>
