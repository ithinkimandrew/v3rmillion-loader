<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img" aria-label="Core capabilities: Stylesheet Repair, Off-Screen Image Recovery, Continuous Scanner, Cloudflare and Ad-Blocker Safe">
  <defs>
    <radialGradient id="bgGlow1" cx="12%" cy="10%" r="48%">
      <stop offset="0" stop-color="#c21b1b" stop-opacity=".22"/>
      <stop offset="1" stop-color="#c21b1b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="88%" cy="92%" r="45%">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".14"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38bdf8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".028"/>
    </pattern>
    <clipPath id="outerClip"><rect width="960" height="290" rx="18"/></clipPath>
    <clipPath id="scanBoxClip"><rect x="16" y="18" width="84" height="83" rx="10"/></clipPath>
  </defs>
  <style>
    .cOrig{transform-box:fill-box;transform-origin:center}
    @keyframes cssBroken{0%,32%{opacity:1}42%,86%{opacity:0}94%,100%{opacity:1}}
    @keyframes cssFixed{0%,32%{opacity:0;transform:scale(.95)}42%,86%{opacity:1;transform:scale(1)}94%,100%{opacity:0;transform:scale(.95)}}
    .cssB{animation:cssBroken 5.2s ease-in-out infinite}
    .cssF{animation:cssFixed 5.2s ease-in-out infinite}

    @keyframes spinRing{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    @keyframes imgBroken{0%,40%{opacity:1}50%,86%{opacity:0}95%,100%{opacity:1}}
    @keyframes imgFixed{0%,40%{opacity:0;transform:scale(.75)}50%,86%{opacity:1;transform:scale(1)}95%,100%{opacity:0;transform:scale(.75)}}
    .orbit{transform-origin:58px 59px;animation:spinRing 2.6s linear infinite}
    .imgB{animation:imgBroken 5.6s ease-in-out infinite}
    .imgF{animation:imgFixed 5.6s ease-in-out infinite}

    @keyframes radarY{0%{transform:translateY(0)}50%{transform:translateY(58px)}100%{transform:translateY(0)}}
    @keyframes node1{0%,18%{fill:#22c55e}36%,100%{fill:#38bdf8}}
    @keyframes node2{0%,20%{fill:#38bdf8}30%,55%{fill:#22c55e}70%,100%{fill:#38bdf8}}
    @keyframes node3{0%,45%{fill:#38bdf8}55%,78%{fill:#22c55e}90%,100%{fill:#38bdf8}}
    .rLine{animation:radarY 3.4s ease-in-out infinite}
    .nd1{animation:node1 3.4s ease-in-out infinite}
    .nd2{animation:node2 3.4s ease-in-out infinite}
    .nd3{animation:node3 3.4s ease-in-out infinite}

    @keyframes shieldRing{0%,100%{opacity:.22;transform:scale(.94)}50%{opacity:.75;transform:scale(1.06)}}
    @keyframes checkGlow{0%,100%{opacity:.65}50%{opacity:1}}
    .sRing{transform-origin:58px 58px;animation:shieldRing 2.8s ease-in-out infinite}
    .sChk{animation:checkGlow 2.8s ease-in-out infinite}
  </style>

  <g clip-path="url(#outerClip)">
    <rect width="960" height="290" fill="#0f0f11"/>
    <rect width="960" height="290" fill="url(#hGrid)"/>
    <rect width="960" height="290" fill="url(#bgGlow1)"/>
    <rect width="960" height="290" fill="url(#bgGlow2)"/>
  </g>
  <rect x=".5" y=".5" width="959" height="289" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- Card 1: Stylesheet Repair -->
  <g transform="translate(18 18)">
    <rect width="454" height="119" rx="13" fill="#17171a" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="0" y="0" width="454" height="2.5" rx="1.25" fill="#e02424" fill-opacity=".65"/>
    <rect x="16" y="18" width="84" height="83" rx="10" fill="#101013" stroke="#ffffff" stroke-opacity=".07"/>

    <g class="cssB">
      <rect x="24" y="27" width="38" height="5" rx="2" fill="#6b6b74"/>
      <rect x="24" y="37" width="66" height="4" rx="2" fill="#6b6b74" fill-opacity=".55"/>
      <rect x="24" y="45" width="52" height="4" rx="2" fill="#6b6b74" fill-opacity=".45"/>
      <rect x="24" y="55" width="60" height="4" rx="2" fill="#6b6b74" fill-opacity=".55"/>
      <rect x="24" y="65" width="44" height="4" rx="2" fill="#6b6b74" fill-opacity=".45"/>
      <rect x="24" y="77" width="48" height="14" rx="4" fill="#c21b1b" fill-opacity=".2" stroke="#e02424" stroke-opacity=".5"/>
      <text x="48" y="87" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="8.5" font-weight="700" fill="#e02424">CSS 0</text>
    </g>
    <g class="cssF cOrig">
      <rect x="24" y="26" width="68" height="13" rx="3.5" fill="#8f1010"/>
      <rect x="29" y="30.5" width="22" height="4" rx="2" fill="#f2f2f3"/>
      <rect x="24" y="44" width="68" height="20" rx="4" fill="#1e1e24" stroke="#ffffff" stroke-opacity=".1"/>
      <rect x="29" y="49" width="36" height="4" rx="2" fill="#f2f2f3" fill-opacity=".85"/>
      <rect x="29" y="56" width="52" height="3.5" rx="1.75" fill="#a1a1aa" fill-opacity=".6"/>
      <rect x="24" y="69" width="31" height="22" rx="4" fill="#1e1e24" stroke="#ffffff" stroke-opacity=".08"/>
      <rect x="61" y="69" width="31" height="22" rx="4" fill="#1e1e24" stroke="#ffffff" stroke-opacity=".08"/>
      <circle cx="88" cy="27" r="7.5" fill="#22c55e"/>
      <path d="M84.8 27l2.2 2.2 4.2-4.4" fill="none" stroke="#0f0f11" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="116" y="37" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f2f2f3">Stylesheet Repair</text>
    <g transform="translate(390 21)">
      <rect width="48" height="22" rx="6" fill="#c21b1b" fill-opacity=".2" stroke="#e02424" stroke-opacity=".45"/>
      <text x="24" y="14.5" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700" fill="#f2f2f3">CSS</text>
    </g>
    <text x="116" y="59" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a1a1aa">Detects empty or failed /css.php stylesheets,</text>
    <text x="116" y="77" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a1a1aa">re-fetches with backoff, and restores layout.</text>
    <text x="116" y="101" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5" font-weight="600" fill="#e02424">FIXES UNSTYLED PAGES AUTOMATICALLY</text>
  </g>

  <!-- Card 2: Off-Screen Image Recovery -->
  <g transform="translate(488 18)">
    <rect width="454" height="119" rx="13" fill="#17171a" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="0" y="0" width="454" height="2.5" rx="1.25" fill="#f59e0b" fill-opacity=".7"/>
    <rect x="16" y="18" width="84" height="83" rx="10" fill="#101013" stroke="#ffffff" stroke-opacity=".07"/>

    <circle cx="58" cy="59" r="28" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>
    <path class="orbit" d="M58 31 A28 28 0 0 1 86 59" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round"/>

    <g class="imgB">
      <rect x="38" y="42" width="40" height="34" rx="6" fill="none" stroke="#6b6b74" stroke-dasharray="3.5 3"/>
      <path d="M47 51h22v16H47z M47 67l7-8 5 4 4-3 6 7" fill="none" stroke="#6b6b74" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M45 47l26 24" stroke="#e02424" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <g class="imgF cOrig">
      <rect x="38" y="40" width="40" height="38" rx="8" fill="#3a8fe0" fill-opacity=".22" stroke="#3a8fe0" stroke-opacity=".5"/>
      <circle cx="58" cy="53" r="6.5" fill="#3a8fe0"/>
      <path d="M46 73c2-6.5 6.5-9.5 12-9.5s10 3 12 9.5z" fill="#3a8fe0"/>
      <circle cx="77" cy="41" r="7.5" fill="#22c55e"/>
      <path d="M73.8 41l2.2 2.2 4.2-4.4" fill="none" stroke="#0f0f11" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="116" y="37" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f2f2f3">Off-Screen Image Recovery</text>
    <g transform="translate(390 21)">
      <rect width="48" height="22" rx="6" fill="#f59e0b" fill-opacity=".16" stroke="#f59e0b" stroke-opacity=".45"/>
      <text x="24" y="14.5" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700" fill="#f59e0b">IMG</text>
    </g>
    <text x="116" y="59" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a1a1aa">Probes original, srcset, s/m/l avatar sizes, and</text>
    <text x="116" y="77" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a1a1aa">cache-busted URLs off-screen, then swaps cleanly.</text>
    <text x="116" y="101" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5" font-weight="600" fill="#f59e0b">ZERO-FLICKER ATOMIC IMAGE SWAPS</text>
  </g>

  <!-- Card 3: Continuous Scanner -->
  <g transform="translate(18 153)">
    <rect width="454" height="119" rx="13" fill="#17171a" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="0" y="0" width="454" height="2.5" rx="1.25" fill="#38bdf8" fill-opacity=".7"/>
    <rect x="16" y="18" width="84" height="83" rx="10" fill="#101013" stroke="#ffffff" stroke-opacity=".07"/>

    <g clip-path="url(#scanBoxClip)">
      <rect x="25" y="29" width="66" height="14" rx="4" fill="#1b1b20"/>
      <circle class="nd1" cx="34" cy="36" r="3.5"/>
      <rect x="43" y="34" width="38" height="4" rx="2" fill="#a1a1aa" fill-opacity=".55"/>

      <rect x="25" y="51" width="66" height="14" rx="4" fill="#1b1b20"/>
      <circle class="nd2" cx="34" cy="58" r="3.5"/>
      <rect x="43" y="56" width="32" height="4" rx="2" fill="#a1a1aa" fill-opacity=".55"/>

      <rect x="25" y="73" width="66" height="14" rx="4" fill="#1b1b20"/>
      <circle class="nd3" cx="34" cy="80" r="3.5"/>
      <rect x="43" y="78" width="42" height="4" rx="2" fill="#a1a1aa" fill-opacity=".55"/>

      <rect class="rLine" x="18" y="24" width="80" height="10" fill="url(#scanLine)"/>
    </g>

    <text x="116" y="37" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f2f2f3">Continuous Scanner</text>
    <g transform="translate(384 21)">
      <rect width="54" height="22" rx="6" fill="#38bdf8" fill-opacity=".15" stroke="#38bdf8" stroke-opacity=".45"/>
      <text x="27" y="14.5" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700" fill="#38bdf8">SCAN</text>
    </g>
    <text x="116" y="59" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a1a1aa">Rechecks every 2.5s, on scroll, tab focus, network</text>
    <text x="116" y="77" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a1a1aa">reconnect, and DOM changes; preloads lazy assets.</text>
    <text x="116" y="101" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5" font-weight="600" fill="#38bdf8">INCLUDES XENFORO JS SCRIPT WATCHDOG</text>
  </g>

  <!-- Card 4: Cloudflare & Ad-Blocker Safe -->
  <g transform="translate(488 153)">
    <rect width="454" height="119" rx="13" fill="#17171a" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="0" y="0" width="454" height="2.5" rx="1.25" fill="#22c55e" fill-opacity=".7"/>
    <rect x="16" y="18" width="84" height="83" rx="10" fill="#101013" stroke="#ffffff" stroke-opacity=".07"/>

    <circle class="sRing" cx="58" cy="58" r="27" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M58 34l18 7.5v13.5c0 11.2-7.5 20.2-18 24-10.5-3.8-18-12.8-18-24V41.5z" fill="#22c55e" fill-opacity=".13" stroke="#f2f2f3" stroke-width="1.8" stroke-linejoin="round"/>
    <path class="sChk" d="M50 57.5l5.5 5.5 11-11.5" fill="none" stroke="#22c55e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="116" y="37" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f2f2f3">Cloudflare &amp; Ad-Blocker Safe</text>
    <g transform="translate(384 21)">
      <rect width="54" height="22" rx="6" fill="#22c55e" fill-opacity=".15" stroke="#22c55e" stroke-opacity=".45"/>
      <text x="27" y="14.5" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700" fill="#22c55e">SAFE</text>
    </g>
    <text x="116" y="59" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a1a1aa">Never touches Cloudflare verification checks and</text>
    <text x="116" y="77" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a1a1aa">never retries ads blocked by Brave Shields or uBlock.</text>
    <text x="116" y="101" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5" font-weight="600" fill="#22c55e">STRICT HOST ALLOWLIST · NO INTERFERENCE</text>
  </g>
</svg>
