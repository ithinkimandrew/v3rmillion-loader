<svg xmlns="http://www.w3.org/2000/svg" width="960" height="58" viewBox="0 0 960 58" role="img" aria-label="The Problem and Solution - Overview">
  <defs>
    <radialGradient id="og" cx="6%" cy="50%" r="34%">
      <stop offset="0" stop-color="#e02424" stop-opacity=".3"/>
      <stop offset="1" stop-color="#e02424" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="obar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e02424"/>
      <stop offset="1" stop-color="#8f1010"/>
    </linearGradient>
    <linearGradient id="obeam" x1="0" x2="1">
      <stop offset="0" stop-color="#e02424" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e02424" stop-opacity=".95"/>
      <stop offset="1" stop-color="#e02424" stop-opacity="0"/>
    </linearGradient>
    <pattern id="ogrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity=".028"/>
    </pattern>
    <clipPath id="oclip"><rect width="960" height="58" rx="12"/></clipPath>
  </defs>
  <style>
    @keyframes sweep{0%{transform:translateX(-280px)}100%{transform:translateX(1020px)}}
    @keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.28}}
    @keyframes barBreath{0%,100%{opacity:.82}50%{opacity:1}}
    @keyframes splitL{0%,100%{transform:translate(0,0)}50%{transform:translate(-1.3px,1px)}}
    @keyframes splitR{0%,100%{transform:translate(0,0)}50%{transform:translate(1.3px,-1px)}}
    @keyframes spark{0%,100%{opacity:1}50%{opacity:.2}}
    .beam{animation:sweep 5.8s cubic-bezier(.4,0,.2,1) infinite}
    .dp{animation:dotPulse 2s ease-in-out infinite}
    .ab{animation:barBreath 3s ease-in-out infinite}
    .sl{animation:splitL 2.6s ease-in-out infinite}
    .sr{animation:splitR 2.6s ease-in-out infinite}
    .sp{animation:spark 1.8s ease-in-out infinite}
  </style>
  <g clip-path="url(#oclip)">
    <rect width="960" height="58" fill="#0f0f11"/>
    <rect width="960" height="58" fill="url(#ogrid)"/>
    <rect width="960" height="58" fill="url(#og)"/>
    <rect x="0" y="56" width="960" height="2" fill="#ffffff" fill-opacity=".05"/>
    <rect class="beam" x="0" y="55.5" width="260" height="2.5" rx="1.25" fill="url(#obeam)"/>
  </g>
  <rect x=".5" y=".5" width="959" height="57" rx="12" fill="none" stroke="#ffffff" stroke-opacity=".09"/>

  <rect class="ab" x="12" y="13" width="3.5" height="32" rx="1.75" fill="url(#obar)"/>
  <rect x="26" y="11" width="36" height="36" rx="9" fill="#17171a" stroke="#e02424" stroke-opacity=".38"/>
  <g transform="translate(44 29)">
    <g class="sl" fill="none" stroke="#f2f2f3" stroke-width="1.8" stroke-linecap="round">
      <path d="M-3 3l-3.5 3.5a3.2 3.2 0 0 1-4.5-4.5l2.5-2.5"/>
    </g>
    <g class="sr" fill="none" stroke="#f2f2f3" stroke-width="1.8" stroke-linecap="round">
      <path d="M3 -3l3.5-3.5a3.2 3.2 0 0 1 4.5 4.5l-2.5 2.5"/>
    </g>
    <path class="sp" d="M-2.5 -6l1.8 2.5M6 -2.5l-2.5 1.8M-6 2.5l2.5-1.8M2.5 6l-1.8-2.5" stroke="#e02424" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <text x="76" y="35.5" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="800" letter-spacing="0.5" fill="#f2f2f3">THE PROBLEM &amp; SOLUTION</text>

  <g transform="translate(768 15)">
    <rect width="176" height="28" rx="14" fill="#17171a" stroke="#ffffff" stroke-opacity=".08"/>
    <circle class="dp" cx="18" cy="14" r="3.5" fill="#e02424"/>
    <text x="31" y="18" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.9" fill="#a1a1aa">01 // OVERVIEW</text>
  </g>
</svg>
