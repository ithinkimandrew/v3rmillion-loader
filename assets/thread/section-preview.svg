<svg xmlns="http://www.w3.org/2000/svg" width="960" height="58" viewBox="0 0 960 58" role="img" aria-label="Interface and Themes - Popup UI">
  <defs>
    <radialGradient id="pg" cx="6%" cy="50%" r="34%">
      <stop offset="0" stop-color="#e02424" stop-opacity=".3"/>
      <stop offset="1" stop-color="#e02424" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e02424"/>
      <stop offset="1" stop-color="#8f1010"/>
    </linearGradient>
    <linearGradient id="pbeam" x1="0" x2="1">
      <stop offset="0" stop-color="#e02424" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e02424" stop-opacity=".95"/>
      <stop offset="1" stop-color="#e02424" stop-opacity="0"/>
    </linearGradient>
    <pattern id="pgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity=".028"/>
    </pattern>
    <clipPath id="pclip"><rect width="960" height="58" rx="12"/></clipPath>
  </defs>
  <style>
    @keyframes sweep{0%{transform:translateX(-280px)}100%{transform:translateX(1020px)}}
    @keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.28}}
    @keyframes barBreath{0%,100%{opacity:.82}50%{opacity:1}}
    @keyframes themeGlow{0%,100%{opacity:.35}50%{opacity:1}}
    .beam{animation:sweep 6.4s cubic-bezier(.4,0,.2,1) infinite}
    .dp{animation:dotPulse 2s ease-in-out infinite}
    .ab{animation:barBreath 3s ease-in-out infinite}
    .tg{animation:themeGlow 2.8s ease-in-out infinite}
  </style>
  <g clip-path="url(#pclip)">
    <rect width="960" height="58" fill="#0f0f11"/>
    <rect width="960" height="58" fill="url(#pgrid)"/>
    <rect width="960" height="58" fill="url(#pg)"/>
    <rect x="0" y="56" width="960" height="2" fill="#ffffff" fill-opacity=".05"/>
    <rect class="beam" x="0" y="55.5" width="260" height="2.5" rx="1.25" fill="url(#pbeam)"/>
  </g>
  <rect x=".5" y=".5" width="959" height="57" rx="12" fill="none" stroke="#ffffff" stroke-opacity=".09"/>

  <rect class="ab" x="12" y="13" width="3.5" height="32" rx="1.75" fill="url(#pbar)"/>
  <rect x="26" y="11" width="36" height="36" rx="9" fill="#17171a" stroke="#e02424" stroke-opacity=".38"/>
  <g transform="translate(34 19)">
    <rect x="1" y="1" width="18" height="18" rx="3.5" fill="none" stroke="#f2f2f3" stroke-width="1.6"/>
    <line x1="1" y1="6.5" x2="19" y2="6.5" stroke="#f2f2f3" stroke-width="1.3" stroke-opacity=".7"/>
    <circle cx="4.5" cy="3.8" r="1" fill="#e02424"/>
    <circle cx="7.8" cy="3.8" r="1" fill="#f59e0b"/>
    <rect class="tg" x="4" y="9.5" width="12" height="2.5" rx="1.2" fill="#22c55e"/>
    <rect x="4" y="13.8" width="7.5" height="2.2" rx="1.1" fill="#a1a1aa"/>
  </g>

  <text x="76" y="35.5" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="800" letter-spacing="0.5" fill="#f2f2f3">INTERFACE &amp; THEMES</text>

  <g transform="translate(768 15)">
    <rect width="176" height="28" rx="14" fill="#17171a" stroke="#ffffff" stroke-opacity=".08"/>
    <circle class="dp" cx="18" cy="14" r="3.5" fill="#e02424"/>
    <text x="31" y="18" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.9" fill="#a1a1aa">03 // POPUP UI</text>
  </g>
</svg>
